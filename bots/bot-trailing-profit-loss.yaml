# This file defines a bot configuration with trailing profit/loss enabled
# This strategy allows capturing a higher percentage of price movement by setting a trailing stop

# Bot identification and connection settings
name: "bot-trailing-pnl"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: true # Set to true to enable this bot
separate_process: false # Run in a separate process

# Geyser configuration (fastest method for getting updates)
geyser:
  endpoint: "${GEYSER_ENDPOINT}"
  api_token: "${GEYSER_API_TOKEN}"
  auth_type: "x-token" # or "basic"

# Trading parameters
trade:
  buy_amount: 0.003 # Amount of SOL to spend when buying (in SOL) (only valid if developer manager is false)
  buy_slippage: 0.3 # Maximum acceptable price deviation (0.3 = 30%) (only valid if developer manager is false)
  sell_slippage: 0.3 # Slippage tolerance for sells
  
  # Trailing profit/loss settings 
  use_trailing_profit_loss: true # Enable trailing profit/loss selling strategy
  trailing_stop_percentage: 0.99 # Trailing stop percentage (0.10 = 10%) (only valid if developer manager is false)
  take_profit_percentage: 0.15 # Take profit percentage (0.15 = 15%) (only valid if developer manager is false)
  percent_sell_amount: 1.0 # Percentage of tokens to sell at take profit (1.0 = 100%). Only applies at take profit; trailing stop sells 100% of tokens. (only valid if developer manager is false)
  price_check_interval: 1.0 # Price check interval in seconds (used as fallback if WebSocket fails)
  stagnation_timeout: 60 # Seconds of no price change before selling

  # EXTREME FAST mode configuration
  extreme_fast_mode: true # Disabling for trailing stop strategy as we need accurate pricing
  # 10M tokens
  extreme_fast_token_amount: 50000 # Amount of tokens to buy (unused when extreme_fast_mode is false) (only valid if developer manager is false)

# Priority fee configuration (only valid if developer manager is false)
priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 1000_0000 # Base fee in microlamports (approx 0.001 SOL)
  extra_percentage: 0.0
  hard_cap: 1000_0000

# Developer manager configuration
developer_manager:
  enabled: false # Set to true to enable multi-developer tracking via PostgreSQL
  db_host: "${PG_HOST}" # PostgreSQL host
  db_port: "${PG_PORT}" # PostgreSQL port
  db_name: "${PG_DATABASE}" # PostgreSQL database name
  db_user: "${PG_USER}" # PostgreSQL username
  db_password: "${PG_PASSWORD}" # PostgreSQL password
  db_query_file: "data/developer_query/query.sql"
  refresh_interval: 1800 # Refresh interval in seconds (30 minutes)
  max_developers: 1000 # Maximum number of developers to track
  max_age_days: 3 # Maximum age of developers in days
  sniped_devs_file: "data/developer_list/sniped_developers.json" # File to store sniped developers

# Discord notification settings
discord:
  webhook_url: "https://discord.com/api/webhooks/1373954827947606117/plJ6-YZbrX2lpquGfoDB46AoE6RABMTASouhXyk65_hobCbkVEhTIRwzCV9wq3ntz7gV"
  queue_size: 1000
  worker_count: 1
  retry_limit: 3 

# Tip manager configuration (only valid if developer manager is false)
use_tip_manager: true # Set to true to enable tip manager for faster transactions
tip_manager: "nozomi" # Method for tip manager: "zeroslot" or "nozomi"
tip_lamports: 2000000 # Amount of lamports to tip for faster transactions (2000000 = 0.002 SOL)

# Zero slot tip manager configuration (only valid if developer manager is false)
zeroslot_tips:
  tip_account: "${ZERO_SLOT_TIP_ACCOUNT}" # Replace with Nozomi's tip account public key
  rpc_url: "${ZERO_SLOT_RPC_URL}" # Replace with Nozomi's RPC URL
  
# Nozomi tip manager configuration (only valid if developer manager is false)
nozomi_tips:
  websocket_url: "${NOZOMI_WEBSOCKET_URL}" # Replace with Nozomi's WebSocket URL
  tip_account: "${NOZOMI_TIP_ACCOUNT}" # Replace with Nozomi's tip account public key
  rpc_url: "${NOZOMI_RPC_URL}" # Replace with Nozomi's RPC URL

# Filters for token selection
filters:
  match_string: null # Only process tokens with this string in name/symbol (null = all tokens)
  bro_address: null # Only trade tokens created by this user address (null = all creators or developers from manager)
  listener_type: "geyser" # Method for detecting new tokens: "pump_portal", "logs", "blocks", or "geyser"
  max_token_age: 0.0005 # Maximum token age in seconds for processing (increased to give time for trailing stop)
  marry_mode: false # Set to false to allow selling
  yolo_mode: true # Trade continuously

# Retry and timeout settings
retries:
  max_attempts: 3
  wait_after_creation: 5 # Reduced waiting time after token creation
  wait_after_buy: 15 # Only applicable if trailing stop is not used
  wait_before_new_token: 15

# Timing settings
timing:
  max_token_age: 0.0005 # Maximum token age in seconds (same as in filters)
  token_wait_timeout: 60 # Increased timeout to allow the bot more time to find tokens

# Token and account management
cleanup:
  mode: "after_sell" # Clean up after each sell
  force_close_with_burn: false
  with_priority_fee: false